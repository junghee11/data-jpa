services:
  api:
    build:
      context: .
      args:
        MODULE_NAME: data-jpa
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # 컨테이너 네트워크 안에서는 localhost 대신 서비스명으로 접근
      DB_URL: jdbc:postgresql://postgres:5432/dev_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - app-network

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: dev_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
